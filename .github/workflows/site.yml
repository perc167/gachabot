# Rebuilds the website and ships it to Cloudflare whenever something the page
# reports on changes. The page is generated from the live command table and
# the roster, so adding a command has to redeploy the site or the command
# list silently goes stale.
name: Deploy the website

on:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'cogs/**'
      - 'tutorial.py'
      - 'tools/build_site.py'
      - 'data/characters.json'
      - 'data/extra_characters.json'
      - 'wrangler.jsonc'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Two pushes close together would otherwise race each other to deploy, and
# whichever finished last would win regardless of which commit was newer.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Writes site/index.html. The generator imports the cogs to read every
      # command, so it needs discord.py installed above.
      - run: python tools/build_site.py

      # The page shipped once without a charset, which turned every em dash
      # and Japanese name to mojibake and broke nothing a build would notice.
      # Check the things whose absence is invisible until someone reads it.
      - name: Check the page before shipping it
        run: |
          python - <<'CHECK'
          import io, sys
          page = io.open("site/index.html", encoding="utf-8").read()
          problems = []
          for needed in ('<!doctype html>', '<meta charset="utf-8">',
                         'name="viewport"', '</body>', '</html>'):
              if page.count(needed) != 1:
                  problems.append(f"{needed!r} appears {page.count(needed)} times, want 1")
          if "__" in page.split("<style>")[0]:
              problems.append("an unfilled __PLACEHOLDER__ made it into the head")
          if len(page) < 80_000:
              problems.append(f"page is only {len(page)} bytes, expected ~140k")
          if problems:
              print("
".join("  " + p for p in problems))
              sys.exit(1)
          print(f"page looks sound: {len(page) / 1024:.0f} KB")
          CHECK

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ff96c7b4430e495e60822f7bc3586662
